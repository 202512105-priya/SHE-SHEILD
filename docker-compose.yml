version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
    networks:
      - sheshield-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sheshield-net

networks:
  sheshield-net:
    driver: bridge

  notification_queue:
    image: redis:7-alpine
    container_name: sheshield-queue
    ports:
      - "6380:6379"
    networks:
      - sheshield-net
